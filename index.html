<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>عبدالقوي يجري</title>
<style>
html, body {margin:0; padding:0; width:100%; height:100%; overflow:hidden; font-family:Arial,sans-serif; background:black;}
#gameArea {
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:black;
}
.star{
  position:absolute;
  background-color:white;
  border-radius:50%;
  opacity:0.8;
  animation:twinkle 2s infinite alternate;
}
@keyframes twinkle{from{opacity:0.3;}to{opacity:1;}}
#player{
  position:absolute;
  bottom:0;
  left:50px;
  width:80px;
  height:120px;
  transition:transform 0.1s;
}
#player.jump{transform: translateY(-5px);}
#player img{width:100%;height:100%;object-fit:contain;}
#nameTag{
  position:absolute;
  width:120px;
  text-align:center;
  color:white;
  font-weight:bold;
}
#score{
  position:absolute;
  top:10px;
  left:10px;
  font-size:20px;
  font-weight:bold;
  color:white;
}
.obstacle{
  width:10px;
  height:20px;
  background-color:#ff0000;
  clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
  position:absolute;
  bottom:0;
}
.blood{
  position:absolute;
  width:10px;
  height:10px;
  background-color:red;
  border-radius:50%;
  pointer-events:none;
}
#gameOverMsg{
  position:absolute;
  width:100%;
  text-align:center;
  top:50%;
  transform:translateY(-50%);
  font-size:30px;
  color:red;
  display:none;
  font-weight:bold;
}
#restartBtn{
  position:absolute;
  top:60%;
  left:50%;
  transform:translateX(-50%);
  font-size:20px;
  padding:10px 20px;
  display:none;
  cursor:pointer;
}
</style>
</head>
<body>
<audio id="bgMusic" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" autoplay loop></audio>
<div id="gameArea">
  <div id="player"><img src="https://i.ibb.co/WJwzLCH/head.png" alt="عبدالقوي"></div>
  <div id="nameTag">عبدالقوي</div>
  <div id="score">Score: 0</div>
  <div id="gameOverMsg">عبدالقوي مااااااااااااات</div>
  <button id="restartBtn">إعادة اللعبة</button>
</div>
<script>
const player=document.getElementById("player");
const nameTag=document.getElementById("nameTag");
const scoreTag=document.getElementById("score");
const gameArea=document.getElementById("gameArea");
const gameOverMsg=document.getElementById("gameOverMsg");
const restartBtn=document.getElementById("restartBtn");

let isJumping=false,jumpVelocity=0,gravity=0.5,playerBottom=0,score=0,gameOver=false,obstacles=[];

// إنشاء النجوم في الخلفية
for(let i=0;i<150;i++){
  const star=document.createElement('div');
  star.classList.add('star');
  star.style.width=star.style.height=Math.random()*3+1+'px';
  star.style.top=Math.random()*window.innerHeight+'px';
  star.style.left=Math.random()*window.innerWidth+'px';
  star.style.animationDuration=(Math.random()*2+1)+'s';
  gameArea.appendChild(star);
}

// وضع اسم عبدالقوي فوق الشخصية
function updateNameTag(){
  nameTag.style.left=(player.offsetLeft+player.offsetWidth/2-60)+"px";
  nameTag.style.bottom=(playerBottom+130)+"px";
}
updateNameTag();

document.addEventListener("keydown",e=>{
  if(e.code==="Space"&&!isJumping&&!gameOver){
    isJumping=true;
    jumpVelocity=10;
    player.classList.add("jump");
  }
});

function createObstacle(){
  if(gameOver) return;
  const obs=document.createElement("div");
  obs.classList.add("obstacle");
  obs.style.left=window.innerWidth+"px";
  gameArea.appendChild(obs);
  obstacles.push(obs);
}

function spawnBlood(){
  for(let i=0;i<100;i++){
    const b=document.createElement("div");
    b.classList.add("blood");
    b.style.width=b.style.height=Math.random()*15+5+'px';
    b.style.left=Math.random()*window.innerWidth+'px';
    b.style.top=Math.random()*window.innerHeight+'px';
    gameArea.appendChild(b);
    setTimeout(()=>b.remove(),2000);
  }
}

function moveObstacles(){
  obstacles.forEach((obs,index)=>{
    if(gameOver) return;
    let left=parseInt(obs.style.left);
    left-=5;
    obs.style.left=left+"px";

    const playerRect=player.getBoundingClientRect();
    const obsRect=obs.getBoundingClientRect();
    if(!(playerRect.right<obsRect.left||playerRect.left>obsRect.right||playerRect.bottom<obsRect.top||playerRect.top>obsRect.bottom)){
      gameOver=true;
      gameOverMsg.style.display="block";
      restartBtn.style.display="block";
      player.style.transform="rotate(180deg)";
      spawnBlood();
    }

    if(left+obs.offsetWidth<0){
      obs.remove();
      obstacles.splice(index,1);
    }
  });
}

function jump(){
  if(isJumping&&!gameOver){
    playerBottom+=jumpVelocity;
    jumpVelocity-=gravity;
    if(playerBottom<=0){
      playerBottom=0;
      isJumping=false;
      player.classList.remove("jump");
    }
  }
  player.style.bottom=playerBottom+"px";
  updateNameTag();
}

function gameLoop(){
  if(!gameOver&&Math.random()<0.02) createObstacle();
  if(!gameOver) score++;
  scoreTag.textContent="Score: "+score;
  moveObstacles();
  jump();
  requestAnimationFrame(gameLoop);
}

restartBtn.addEventListener("click",()=>{
  gameOver=false;
  obstacles.forEach(obs=>obs.remove());
  obstacles=[];
  score=0;
  playerBottom=0;
  isJumping=false;
  player.style.transform="rotate(0deg)";
  gameOverMsg.style.display="none";
  restartBtn.style.display="none";
});

window.addEventListener("resize", ()=>{
  // إعادة وضع النجوم عند تغيير حجم الشاشة
  document.querySelectorAll('.star').forEach(star=>{
    star.style.top=Math.random()*window.innerHeight+'px';
    star.style.left=Math.random()*window.innerWidth+'px';
  });
});

gameLoop();
</script>
</body>
</html>
