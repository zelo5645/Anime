<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشاهدة الأنمي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(180deg, rgba(10,15,30,0.9), rgba(20,25,40,0.9));
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: start;
      min-height: 100vh;
      padding: 20px;
      backdrop-filter: blur(15px);
    }

    header {
      width: 90%;
      max-width: 900px;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255,255,255,0.2);
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    .poster {
      width: 200px;
      height: 280px;
      border-radius: 15px;
      overflow: hidden;
      margin: 20px 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .frame-container {
      width: 90%;
      max-width: 900px;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 4px 30px rgba(0,0,0,0.2);
    }

    iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="animeTitle">chainsawman reze arc</h1>
  </header>

  <div class="poster">
    <img id="animePoster" src="https://i.ibb.co/1rj7LJj/anime-sample.jpg" alt="صورة الأنمي" />
  </div>

  <div class="frame-container">
    <iframe id="animePlayer" src="https://example.com/embed/episode1" allowfullscreen></iframe>
  </div>

  <script>
    // يمكنك تعديل هذه القيم يدويًا لعرض أنمي مختلف أو حلقة مختلفة:
    document.getElementById('animeTitle').textContent = 'chainsawman reze arc';
    document.getElementById('animePoster').src = 'https://assets.voxcinemas.com/posters/P_HO00012473_1758194053696.jpg';
    document.getElementById('animePlayer').src = 'https://turbovidhls.com/t/68dc63c76e5b8';
  </script>
</body>
</html>
